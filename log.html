<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utility Tracker — Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F2EE;
    --surface: #FFFFFF;
    --surface2: #F9F8F6;
    --border: #E2DDD6;
    --border2: #CCC8C0;
    --text: #1A1916;
    --text2: #6B6860;
    --text3: #A09D98;
    --accent: #1A3A5C;
    --accent2: #2A5A8C;
    --hydro: #1A3A5C;
    --water: #0F6E56;
    --gas: #7A4200;
    --danger: #C0392B;
    --danger-bg: #FDF0EE;
    --warn: #B8800A;
    --warn-bg: #FDFAEF;
    --success: #1A6B3A;
    --radius: 10px;
    --radius-lg: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── NAV ── */
  .nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    display: flex; align-items: center; justify-content: space-between;
    height: 56px; position: sticky; top: 0; z-index: 100;
  }
  .nav-brand { font-size: 15px; font-weight: 600; letter-spacing: -.3px; color: var(--text); }
  .nav-brand span { color: var(--accent); }
  .nav-date-wrap { display: flex; align-items: center; gap: 8px; }
  .nav-date-btn {
    background: none; border: 1px solid var(--border2); border-radius: 8px;
    padding: 6px 10px; font: 500 13px 'DM Sans', sans-serif; color: var(--text);
    cursor: pointer; transition: background .15s;
  }
  .nav-date-btn:hover { background: var(--bg); }
  .nav-date-btn.arrow { padding: 6px 10px; color: var(--text2); font-size: 15px; }
  #nav-date-display { font: 500 14px 'DM Mono', monospace; color: var(--text); min-width: 110px; text-align: center; }
  .nav-date-input { font: 14px 'DM Sans', sans-serif; border: 1px solid var(--border2); border-radius: 8px; padding: 6px 10px; background: var(--surface); color: var(--text); cursor: pointer; }

  /* ── TABS ── */
  .tab-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    display: flex; gap: 0;
  }
  .tab-btn {
    padding: 12px 20px; font: 500 13px 'DM Sans', sans-serif;
    border: none; background: none; cursor: pointer; color: var(--text2);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color .15s, border-color .15s;
    display: flex; align-items: center; gap: 6px;
  }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-btn .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot-hydro { background: var(--hydro); }
  .dot-water { background: var(--water); }
  .dot-gas { background: var(--gas); }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; z-index: 100;
  }
  .bottom-btn {
    flex: 1; padding: 10px 0; font: 500 12px 'DM Sans', sans-serif;
    border: none; background: none; cursor: pointer; color: var(--text2);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: color .15s;
  }
  .bottom-btn.active { color: var(--accent); }
  .bottom-btn svg { width: 20px; height: 20px; }

  /* ── CONTENT ── */
  .content { padding: 16px 16px 90px; max-width: 600px; margin: 0 auto; }

  /* ── METER CARD ── */
  .meter-section { margin-bottom: 8px; }
  .meter-section-title {
    font: 500 11px 'DM Sans', sans-serif;
    color: var(--text3); text-transform: uppercase; letter-spacing: .06em;
    padding: 12px 0 6px;
  }
  .meter-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    margin-bottom: 8px;
    transition: border-color .15s;
  }
  .meter-card:focus-within { border-color: var(--accent2); }
  .meter-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .meter-name { font: 500 14px 'DM Sans', sans-serif; color: var(--text); }
  .meter-meta { font: 400 12px 'DM Sans', sans-serif; color: var(--text2); margin-top: 2px; }
  .meter-id-badge {
    font: 500 11px 'DM Mono', monospace;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 8px; color: var(--text2);
  }
  .meter-input-row { display: flex; align-items: center; gap: 8px; }
  .meter-input {
    flex: 1; font: 500 16px 'DM Mono', monospace;
    border: 1.5px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
    color: var(--text); background: var(--surface2);
    transition: border-color .15s, background .15s;
    outline: none; text-align: right;
  }
  .meter-input:focus { border-color: var(--accent2); background: var(--surface); }
  .meter-input.has-value { background: var(--surface); }
  .meter-unit {
    font: 400 13px 'DM Sans', sans-serif; color: var(--text2);
    min-width: 52px;
  }
  .meter-warn {
    font: 400 12px 'DM Sans', sans-serif;
    color: var(--warn); background: var(--warn-bg);
    border-radius: 6px; padding: 4px 8px; margin-top: 6px;
    display: none;
  }
  .meter-warn.show { display: block; }

  /* ── EVENT CARD ── */
  .event-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-top: 16px;
  }
  .event-title { font: 500 14px 'DM Sans', sans-serif; color: var(--text); margin-bottom: 12px; }
  .event-toggle-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .event-toggle-btn {
    flex: 1; padding: 9px; font: 500 13px 'DM Sans', sans-serif;
    border: 1.5px solid var(--border); border-radius: 8px;
    background: var(--surface2); color: var(--text2);
    cursor: pointer; transition: all .15s;
  }
  .event-toggle-btn.active-event { border-color: var(--hydro); background: #EEF2F8; color: var(--hydro); }
  .event-toggle-btn.active-eng { border-color: var(--water); background: #EEF7F4; color: var(--water); }
  .event-note {
    width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font: 400 13px 'DM Sans', sans-serif;
    color: var(--text); background: var(--surface2); resize: vertical;
    min-height: 70px; outline: none; transition: border-color .15s;
  }
  .event-note:focus { border-color: var(--accent2); background: var(--surface); }
  .event-save-btn {
    margin-top: 10px; width: 100%; padding: 10px;
    font: 500 13px 'DM Sans', sans-serif;
    background: var(--accent); color: #fff;
    border: none; border-radius: 8px; cursor: pointer;
    transition: background .15s;
  }
  .event-save-btn:hover { background: var(--accent2); }
  .event-save-btn:disabled { background: var(--text3); cursor: default; }

  /* ── LOADING / EMPTY ── */
  .loading { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 14px; }
  .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── MODAL ── */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.4);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 999; padding: 0;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface); border-radius: 20px 20px 0 0;
    padding: 24px 20px 36px; width: 100%; max-width: 600px;
    transform: translateY(20px); transition: transform .2s;
  }
  .modal-backdrop.open .modal { transform: translateY(0); }
  .modal-title { font: 600 16px 'DM Sans', sans-serif; color: var(--text); margin-bottom: 6px; }
  .modal-detail { font: 400 14px 'DM Sans', sans-serif; color: var(--text2); margin-bottom: 20px; line-height: 1.5; }
  .modal-value { font: 600 22px 'DM Mono', monospace; color: var(--text); margin-bottom: 4px; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btn {
    flex: 1; padding: 13px; border-radius: 10px;
    font: 500 14px 'DM Sans', sans-serif; cursor: pointer;
    border: 1.5px solid var(--border); background: var(--surface2); color: var(--text);
    transition: all .15s;
  }
  .modal-btn.confirm { background: var(--accent); border-color: var(--accent); color: #fff; }
  .modal-btn.confirm:hover { background: var(--accent2); }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--text); color: #fff; border-radius: 10px;
    padding: 10px 18px; font: 500 13px 'DM Sans', sans-serif;
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 1000; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger); }
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-brand">Utility <span>Tracker</span></div>
  <div class="nav-date-wrap">
    <button class="nav-date-btn arrow" onclick="changeDate(-1)">&#8592;</button>
    <input type="date" id="nav-date-input" class="nav-date-input" onchange="onDateChange(this.value)">
    <button class="nav-date-btn arrow" onclick="changeDate(1)">&#8594;</button>
  </div>
</nav>

<!-- UTILITY TABS -->
<div class="tab-bar" id="tab-bar"></div>

<!-- MAIN CONTENT -->
<div class="content" id="content">
  <div class="loading"><div class="spinner"></div>Loading config…</div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="bottom-btn active" onclick="goPage('log')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5"/><path d="M17.5 3.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 8.5-8.5z"/></svg>
    Log
  </button>
  <button class="bottom-btn" onclick="goPage('daily')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    Daily
  </button>
  <button class="bottom-btn" onclick="goPage('report')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Report
  </button>
</nav>

<!-- CONFIRM MODAL -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">Confirm reading</div>
    <div class="modal-value" id="modal-value"></div>
    <div class="modal-detail" id="modal-detail"></div>
    <div class="modal-btns">
      <button class="modal-btn" onclick="closeModal()">Cancel</button>
      <button class="modal-btn confirm" onclick="confirmSave()">Confirm & save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────
// Replace with your deployed Apps Script URL
const API_URL = "https://script.google.com/macros/s/AKfycbzQG2owq-8xkxg4DnLjOaI0nO6u0y5dhcHpgtV78TK-zII3-CvkW5XqQo6ENXJfUF2Jrg/exec";

let config = null;
let activeUtility = null;
let selectedDate = todayStr();
let pendingSave = null;
let existingReadings = {};
let existingEvent = null;

// ── INIT ────────────────────────────────────────────────────
window.onload = async () => {
  document.getElementById("nav-date-input").value = selectedDate;
  await loadConfig();
};

async function loadConfig() {
  try {
    const res = await fetch(`${API_URL}?action=getConfig`);
    config = await res.json();
    renderTabs();
    await loadPage();
  } catch(e) {
    document.getElementById("content").innerHTML = `<div class="loading">⚠ Could not load config. Check API URL.</div>`;
  }
}

// ── TABS ────────────────────────────────────────────────────
function renderTabs() {
  const utilities = [...new Set(config.meters.map(m => m.utility))];
  if (!activeUtility) activeUtility = utilities[0];
  const bar = document.getElementById("tab-bar");
  bar.innerHTML = utilities.map(u => `
    <button class="tab-btn ${u === activeUtility ? 'active' : ''}" onclick="switchTab('${u}')">
      <span class="dot dot-${u.toLowerCase()}"></span>${u}
    </button>
  `).join("");
}

function switchTab(utility) {
  activeUtility = utility;
  renderTabs();
  renderMeters();
}

// ── PAGE LOAD ───────────────────────────────────────────────
async function loadPage() {
  existingReadings = {};
  existingEvent = null;
  const meters = config.meters;

  // Fetch existing readings for all meters on this date
  await Promise.all(meters.map(async m => {
    const res = await fetch(`${API_URL}?action=getReading&date=${selectedDate}&meterId=${encodeURIComponent(m.meterId)}`);
    const data = await res.json();
    if (data.found) existingReadings[m.meterId] = data.value;
  }));

  // Fetch event for this date
  try {
    const res = await fetch(`${API_URL}?action=getDaily&date=${selectedDate}`);
    const data = await res.json();
    existingEvent = data.event;
  } catch(e) {}

  renderMeters();
}

// ── RENDER METERS ───────────────────────────────────────────
function renderMeters() {
  const meters = config.meters.filter(m => m.utility === activeUtility);
  const buildings = [...new Set(meters.map(m => m.building))];
  const content = document.getElementById("content");

  let html = "";

  buildings.forEach(building => {
    const bMeters = meters.filter(m => m.building === building);
    html += `<div class="meter-section">
      <div class="meter-section-title">${building}</div>`;

    bMeters.forEach(m => {
      const existing = existingReadings[m.meterId];
      const hasValue = existing !== undefined && existing !== null;
      // Check previous day missing
      html += `
      <div class="meter-card" id="card-${m.meterId}">
        <div class="meter-card-header">
          <div>
            <div class="meter-name">${m.meterName}</div>
            <div class="meter-meta">${m.unitDesc || m.unit}</div>
          </div>
          <span class="meter-id-badge">${m.meterId}</span>
        </div>
        <div class="meter-input-row">
          <input class="meter-input ${hasValue ? 'has-value' : ''}"
            type="number" step="0.001" min="0"
            id="input-${m.meterId}"
            value="${hasValue ? existing : ''}"
            placeholder="000000.000"
            data-meterid="${m.meterId}"
            data-original="${hasValue ? existing : ''}"
            onchange="onInputChange(this)"
          >
          <span class="meter-unit">${m.unit}</span>
        </div>
        <div class="meter-warn" id="warn-${m.meterId}">⚠ Previous day reading missing</div>
      </div>`;
    });

    html += `</div>`;
  });

  // Event / Log Details card
  const evType = existingEvent ? existingEvent.type : "";
  const evNote = existingEvent ? existingEvent.note : "";
  html += `
  <div class="event-card">
    <div class="event-title">Log details — ${formatDisplayDate(selectedDate)}</div>
    <div class="event-toggle-row">
      <button class="event-toggle-btn ${evType==='Event'?'active-event':''}" id="btn-event" onclick="toggleEvent('Event')">Event</button>
      <button class="event-toggle-btn ${evType==='Engineering'?'active-eng':''}" id="btn-eng" onclick="toggleEvent('Engineering')">Engineering</button>
    </div>
    <textarea class="event-note" id="event-note" placeholder="Optional note…">${evNote}</textarea>
    <button class="event-save-btn" onclick="saveEvent()">Save log details</button>
  </div>`;

  content.innerHTML = html;
  checkPreviousDayMissing();
}

// ── PREVIOUS DAY CHECK ──────────────────────────────────────
async function checkPreviousDayMissing() {
  const prevDate = offsetDate(selectedDate, -1);
  const meters = config.meters.filter(m => m.utility === activeUtility);
  await Promise.all(meters.map(async m => {
    const res = await fetch(`${API_URL}?action=getReading&date=${prevDate}&meterId=${encodeURIComponent(m.meterId)}`);
    const data = await res.json();
    if (!data.found) {
      const warn = document.getElementById(`warn-${m.meterId}`);
      if (warn) warn.classList.add("show");
    }
  }));
}

// ── INPUT CHANGE ────────────────────────────────────────────
function onInputChange(input) {
  const meterId = input.dataset.meterid;
  const value = parseFloat(input.value);
  if (isNaN(value) || input.value === "") return;
  const meter = config.meters.find(m => m.meterId === meterId);
  const original = input.dataset.original;
  const isOverwrite = original !== "" && original !== undefined;
  pendingSave = { meterId, value, meter, isOverwrite };
  openModal(meter, value, isOverwrite, original);
}

// ── MODAL ───────────────────────────────────────────────────
function openModal(meter, value, isOverwrite, original) {
  document.getElementById("modal-title").textContent = isOverwrite ? "Update reading" : "Confirm reading";
  document.getElementById("modal-value").textContent = formatReading(value) + " " + meter.unit;
  let detail = `${meter.meterName} (ID: ${meter.meterId})\n${formatDisplayDate(selectedDate)}`;
  if (isOverwrite) detail += `\n\nThis will replace the existing reading of ${formatReading(parseFloat(original))} ${meter.unit}.`;
  document.getElementById("modal-detail").textContent = detail;
  document.getElementById("modal").classList.add("open");
}

function closeModal() {
  document.getElementById("modal").classList.remove("open");
  // Restore original value
  if (pendingSave) {
    const inp = document.getElementById(`input-${pendingSave.meterId}`);
    if (inp) {
      const orig = inp.dataset.original;
      inp.value = orig !== "" ? orig : "";
    }
  }
  pendingSave = null;
}

async function confirmSave() {
  document.getElementById("modal").classList.remove("open");
  if (!pendingSave) return;
  const { meterId, value } = pendingSave;
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "saveReading", date: selectedDate, meterId, value })
    });
    const data = await res.json();
    if (data.success) {
      existingReadings[meterId] = value;
      const inp = document.getElementById(`input-${meterId}`);
      if (inp) { inp.dataset.original = value; inp.classList.add("has-value"); }
      showToast("Reading saved");
    } else {
      showToast("Save failed: " + (data.error || "unknown"), true);
    }
  } catch(e) {
    showToast("Network error", true);
  }
  pendingSave = null;
}

// ── EVENT ────────────────────────────────────────────────────
let activeEventType = null;
function toggleEvent(type) {
  const btnEvent = document.getElementById("btn-event");
  const btnEng = document.getElementById("btn-eng");
  if (activeEventType === type) {
    activeEventType = null;
    btnEvent.classList.remove("active-event");
    btnEng.classList.remove("active-eng");
  } else {
    activeEventType = type;
    btnEvent.classList.toggle("active-event", type === "Event");
    btnEng.classList.toggle("active-eng", type === "Engineering");
  }
}

async function saveEvent() {
  const note = document.getElementById("event-note").value.trim();
  const type = activeEventType || existingEvent?.type || "";
  if (!type && !note) { showToast("Select Event or Engineering first"); return; }
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "saveEvent", date: selectedDate, type, note })
    });
    const data = await res.json();
    if (data.success) showToast("Log details saved");
    else showToast("Failed: " + (data.error || ""), true);
  } catch(e) { showToast("Network error", true); }
}

// ── DATE NAV ─────────────────────────────────────────────────
function changeDate(delta) {
  selectedDate = offsetDate(selectedDate, delta);
  document.getElementById("nav-date-input").value = selectedDate;
  loadPage();
}

function onDateChange(val) {
  selectedDate = val;
  loadPage();
}

// ── PAGE NAVIGATION ─────────────────────────────────────────
function goPage(page) {
  if (page === "daily") window.location.href = `daily.html?date=${selectedDate}`;
  if (page === "report") window.location.href = "report.html";
}

// ── HELPERS ──────────────────────────────────────────────────
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function offsetDate(dateStr, days) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function formatReading(v) {
  return v.toLocaleString("en-CA", { minimumFractionDigits: 3, maximumFractionDigits: 3 });
}
function formatDisplayDate(dateStr) {
  return new Date(dateStr + "T12:00:00").toLocaleDateString("en-CA", { year:"numeric", month:"long", day:"numeric" });
}
function showToast(msg, isError = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (isError ? " error" : "");
  setTimeout(() => { t.className = "toast"; }, 3000);
}
</script>
</body>
</html>
