<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utility Tracker — Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #F4F2EE; --surface: #FFFFFF; --surface2: #F9F8F6;
    --border: #E2DDD6; --border2: #CCC8C0;
    --text: #1A1916; --text2: #6B6860; --text3: #A09D98;
    --accent: #1A3A5C; --danger: #C0392B; --danger-bg: #FDF0EE;
    --warn: #B8800A;
    --radius: 10px; --radius-lg: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; display: flex; align-items: center; height: 56px; position: sticky; top: 0; z-index: 100; }
  .nav-brand { font-size: 15px; font-weight: 600; letter-spacing: -.3px; color: var(--text); }
  .nav-brand span { color: var(--accent); }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); display: flex; z-index: 100; }
  .bottom-btn { flex: 1; padding: 10px 0; font: 500 12px 'DM Sans', sans-serif; border: none; background: none; cursor: pointer; color: var(--text2); display: flex; flex-direction: column; align-items: center; gap: 3px; transition: color .15s; }
  .bottom-btn.active { color: var(--accent); }
  .bottom-btn svg { width: 20px; height: 20px; }

  .content { padding: 16px 16px 90px; max-width: 700px; margin: 0 auto; }

  /* Filter card */
  .filter-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 16px; }
  .filter-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 12px; }
  .filter-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 130px; }
  .filter-label { font: 500 11px 'DM Sans', sans-serif; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; }
  .filter-input {
    border: 1.5px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font: 14px 'DM Sans', sans-serif; color: var(--text);
    background: var(--surface2); outline: none; transition: border-color .15s;
  }
  .filter-input:focus { border-color: var(--accent); }
  .fetch-btn {
    padding: 9px 18px; background: var(--accent); color: #fff;
    border: none; border-radius: 8px; font: 500 13px 'DM Sans', sans-serif;
    cursor: pointer; transition: background .15s; white-space: nowrap; align-self: flex-end;
  }
  .fetch-btn:hover { background: #2A5A8C; }

  /* Meter checkboxes */
  .meter-filter-section { margin-bottom: 6px; }
  .meter-filter-title { font: 500 11px 'DM Sans', sans-serif; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  .utility-group { margin-bottom: 10px; }
  .utility-group-label { font: 500 12px 'DM Sans', sans-serif; color: var(--text2); display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .u-dot { width: 7px; height: 7px; border-radius: 50%; }
  .checkbox-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .meter-check {
    display: flex; align-items: center; gap: 5px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 10px; cursor: pointer;
    font: 400 12px 'DM Sans', sans-serif; color: var(--text2);
    transition: all .15s; user-select: none;
  }
  .meter-check.checked { background: var(--accent); border-color: var(--accent); color: #fff; }
  .meter-check input { display: none; }

  /* Chart */
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 16px; }
  .chart-title { font: 500 13px 'DM Sans', sans-serif; color: var(--text); margin-bottom: 12px; }
  .chart-wrap { position: relative; height: 260px; }

  .loading { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 14px; }
  .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state { text-align: center; padding: 30px; color: var(--text3); font-size: 14px; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">Utility <span>Tracker</span></div>
</nav>

<div class="content">
  <!-- Filter -->
  <div class="filter-card">
    <div class="filter-row">
      <div class="filter-group">
        <label class="filter-label">From</label>
        <input type="date" id="start-date" class="filter-input">
      </div>
      <div class="filter-group">
        <label class="filter-label">To</label>
        <input type="date" id="end-date" class="filter-input">
      </div>
      <button class="fetch-btn" onclick="fetchReport()">Load</button>
    </div>
    <div id="meter-filters" class="meter-filter-section" style="display:none"></div>
  </div>

  <!-- Charts area -->
  <div id="charts-area"><div class="empty-state">Select a date range and press Load.</div></div>
</div>

<nav class="bottom-nav">
  <button class="bottom-btn" onclick="window.location.href='log.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5"/><path d="M17.5 3.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 8.5-8.5z"/></svg>
    Log
  </button>
  <button class="bottom-btn" onclick="window.location.href='daily.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    Daily
  </button>
  <button class="bottom-btn active" onclick="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Report
  </button>
</nav>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzQG2owq-8xkxg4DnLjOaI0nO6u0y5dhcHpgtV78TK-zII3-CvkW5XqQo6ENXJfUF2Jrg/exec";

const METER_COLORS = [
  "#1A3A5C","#2E86AB","#0F6E56","#5DCAA5","#7A4200","#E8A838",
  "#6B3FA0","#C06060","#3A7D44","#B85C1C"
];
const UTILITY_COLORS = { Hydro: "#1A3A5C", Water: "#0F6E56", Gas: "#7A4200" };

let configData = null;
let reportData = null;
let checkedMeters = new Set();
let charts = [];

// Set default date range: last 30 days
const today = new Date();
const past = new Date(); past.setDate(today.getDate() - 30);
document.getElementById("end-date").value = today.toISOString().slice(0,10);
document.getElementById("start-date").value = past.toISOString().slice(0,10);

window.onload = async () => {
  const res = await fetch(`${API_URL}?action=getConfig`);
  configData = await res.json();
  configData.meters.forEach(m => checkedMeters.add(m.meterId));
  renderMeterFilters();
};

function renderMeterFilters() {
  if (!configData) return;
  const utilities = [...new Set(configData.meters.map(m => m.utility))];
  let html = `<div class="meter-filter-title">Show / hide meters</div>`;
  utilities.forEach(u => {
    const meters = configData.meters.filter(m => m.utility === u);
    html += `<div class="utility-group">
      <div class="utility-group-label">
        <span class="u-dot" style="background:${UTILITY_COLORS[u]||'#888'}"></span>${u}
      </div>
      <div class="checkbox-row">`;
    meters.forEach(m => {
      const checked = checkedMeters.has(m.meterId);
      html += `<label class="meter-check ${checked?'checked':''}" id="lbl-${m.meterId}" onclick="toggleMeter('${m.meterId}')">
        ${m.meterName} <span style="opacity:.7;font-size:11px">${m.meterId}</span>
      </label>`;
    });
    html += `</div></div>`;
  });
  const el = document.getElementById("meter-filters");
  el.innerHTML = html;
  el.style.display = "block";
}

function toggleMeter(meterId) {
  if (checkedMeters.has(meterId)) checkedMeters.delete(meterId);
  else checkedMeters.add(meterId);
  document.getElementById(`lbl-${meterId}`)?.classList.toggle("checked", checkedMeters.has(meterId));
  if (reportData) renderCharts();
}

async function fetchReport() {
  const start = document.getElementById("start-date").value;
  const end = document.getElementById("end-date").value;
  if (!start || !end) return;
  document.getElementById("charts-area").innerHTML = `<div class="loading"><div class="spinner"></div>Loading report…</div>`;
  try {
    const res = await fetch(`${API_URL}?action=getReport&startDate=${start}&endDate=${end}`);
    reportData = await res.json();
    renderCharts();
  } catch(e) {
    document.getElementById("charts-area").innerHTML = `<div class="empty-state">⚠ Could not load report data.</div>`;
  }
}

function renderCharts() {
  charts.forEach(c => c.destroy());
  charts = [];

  if (!reportData || !reportData.data || reportData.data.length === 0) {
    document.getElementById("charts-area").innerHTML = `<div class="empty-state">No data in this date range.</div>`;
    return;
  }

  const utilities = [...new Set(configData.meters.map(m => m.utility))];
  let html = "";
  utilities.forEach(u => {
    const meters = configData.meters.filter(m => m.utility === u && checkedMeters.has(m.meterId));
    if (meters.length === 0) return;
    html += `<div class="chart-card">
      <div class="chart-title" style="color:${UTILITY_COLORS[u]||'#333'}">${u} — daily consumption</div>
      <div class="chart-wrap"><canvas id="chart-${u}"></canvas></div>
    </div>`;
  });

  if (!html) { document.getElementById("charts-area").innerHTML = `<div class="empty-state">No meters selected.</div>`; return; }
  document.getElementById("charts-area").innerHTML = html;

  // Collect all dates in range
  const allDates = [...new Set(reportData.data.map(r => r.date))].sort();
  const eventDates = new Set(reportData.data.filter(r => r.event).map(r => r.date));

  utilities.forEach((u, ui) => {
    const canvas = document.getElementById(`chart-${u}`);
    if (!canvas) return;
    const meters = configData.meters.filter(m => m.utility === u && checkedMeters.has(m.meterId));

    const datasets = meters.map((m, mi) => {
      const color = METER_COLORS[mi % METER_COLORS.length];
      const points = allDates.map(d => {
        const r = reportData.data.find(rd => rd.date === d && rd.meterId === m.meterId);
        return r && r.consumption !== null ? r.consumption : null;
      });
      const pointColors = allDates.map(d => {
        const r = reportData.data.find(rd => rd.date === d && rd.meterId === m.meterId);
        if (!r || r.consumption === null) return "transparent";
        if (r.outOfRange) return "#C0392B";
        return color;
      });
      const pointRadius = allDates.map(d => {
        const r = reportData.data.find(rd => rd.date === d && rd.meterId === m.meterId);
        if (r && r.outOfRange) return 6;
        return 3;
      });
      return {
        label: `${m.meterName} (${m.meterId})`,
        data: points, borderColor: color, backgroundColor: color + "20",
        pointBackgroundColor: pointColors, pointRadius: pointRadius,
        pointHoverRadius: 6, tension: 0.3, spanGaps: false,
        borderWidth: 1.8
      };
    });

    const chart = new Chart(canvas, {
      type: "line",
      data: { labels: allDates, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { position: "bottom", labels: { font: { family: "DM Sans", size: 12 }, boxWidth: 12, padding: 16 } },
          tooltip: {
            callbacks: {
              label: ctx => {
                if (ctx.parsed.y === null) return `${ctx.dataset.label}: missing`;
                return `${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString("en-CA", {minimumFractionDigits:3, maximumFractionDigits:3})}`;
              }
            }
          }
        },
        scales: {
          x: {
            ticks: { font: { family: "DM Mono", size: 10 }, maxRotation: 45, maxTicksLimit: 12 },
            grid: { color: "#E2DDD6" }
          },
          y: {
            ticks: { font: { family: "DM Mono", size: 11 } },
            grid: { color: "#E2DDD6" }
          }
        }
      },
      plugins: [{
        id: "eventLines",
        afterDraw(chart) {
          const ctx = chart.ctx;
          allDates.forEach((d, i) => {
            if (!eventDates.has(d)) return;
            const x = chart.scales.x.getPixelForValue(i);
            ctx.save();
            ctx.strokeStyle = "#F5C842";
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 3]);
            ctx.beginPath();
            ctx.moveTo(x, chart.chartArea.top);
            ctx.lineTo(x, chart.chartArea.bottom);
            ctx.stroke();
            ctx.restore();
          });
        }
      }]
    });
    charts.push(chart);
  });
}
</script>
</body>
</html>
