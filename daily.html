<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utility Tracker — Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F2EE; --surface: #FFFFFF; --surface2: #F9F8F6;
    --border: #E2DDD6; --border2: #CCC8C0;
    --text: #1A1916; --text2: #6B6860; --text3: #A09D98;
    --accent: #1A3A5C; --accent2: #2A5A8C;
    --hydro: #1A3A5C; --water: #0F6E56; --gas: #7A4200;
    --danger: #C0392B; --danger-bg: #FDF0EE;
    --warn: #B8800A; --warn-bg: #FDFAEF;
    --radius: 10px; --radius-lg: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .nav {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 20px; display: flex; align-items: center; justify-content: space-between;
    height: 56px; position: sticky; top: 0; z-index: 100;
  }
  .nav-brand { font-size: 15px; font-weight: 600; letter-spacing: -.3px; color: var(--text); }
  .nav-brand span { color: var(--accent); }
  .nav-date-btn {
    background: none; border: 1px solid var(--border2); border-radius: 8px;
    padding: 6px 10px; font: 500 13px 'DM Sans', sans-serif; color: var(--text);
    cursor: pointer; transition: background .15s;
  }
  .nav-date-btn:hover { background: var(--bg); }
  .nav-date-wrap { display: flex; align-items: center; gap: 8px; }
  .nav-date-btn.arrow { padding: 6px 10px; color: var(--text2); font-size: 15px; }
  .nav-date-input { font: 14px 'DM Sans', sans-serif; border: 1px solid var(--border2); border-radius: 8px; padding: 6px 10px; background: var(--surface); color: var(--text); cursor: pointer; }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); display: flex; z-index: 100; }
  .bottom-btn { flex: 1; padding: 10px 0; font: 500 12px 'DM Sans', sans-serif; border: none; background: none; cursor: pointer; color: var(--text2); display: flex; flex-direction: column; align-items: center; gap: 3px; transition: color .15s; }
  .bottom-btn.active { color: var(--accent); }
  .bottom-btn svg { width: 20px; height: 20px; }

  .content { padding: 16px 16px 90px; max-width: 600px; margin: 0 auto; }

  .event-banner {
    background: #FFF8E8; border: 1px solid #F5C842;
    border-radius: var(--radius-lg); padding: 12px 16px; margin-bottom: 16px;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .event-banner-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
  .event-banner-title { font: 600 13px 'DM Sans', sans-serif; color: #7A5800; }
  .event-banner-note { font: 400 12px 'DM Sans', sans-serif; color: #9A7010; margin-top: 2px; }

  .utility-section { margin-bottom: 20px; }
  .utility-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 0 8px;
  }
  .utility-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .utility-label { font: 600 13px 'DM Sans', sans-serif; color: var(--text); }

  .reading-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 8px;
  }
  .reading-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .reading-left .meter-name { font: 500 14px 'DM Sans', sans-serif; color: var(--text); }
  .reading-left .meter-sub { font: 400 12px 'DM Sans', sans-serif; color: var(--text2); margin-top: 2px; }
  .reading-right { text-align: right; }
  .reading-value { font: 600 18px 'DM Mono', monospace; color: var(--text); }
  .reading-value.out-of-range { color: var(--danger); }
  .reading-value.missing { font: 500 14px 'DM Sans', sans-serif; color: var(--danger); }
  .reading-unit { font: 400 12px 'DM Sans', sans-serif; color: var(--text2); margin-top: 2px; }
  .calc-badge {
    display: inline-block; font: 400 11px 'DM Sans', sans-serif;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 5px; padding: 2px 6px; color: var(--text3); margin-top: 4px;
  }
  .calc-badge.avg { background: var(--warn-bg); color: var(--warn); border-color: #F5C842; }

  .loading { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 14px; }
  .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .date-heading {
    font: 400 13px 'DM Sans', sans-serif; color: var(--text2);
    text-align: center; padding: 8px 0 4px; margin-bottom: 4px;
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">Utility <span>Tracker</span></div>
  <div class="nav-date-wrap">
    <button class="nav-date-btn arrow" onclick="changeDate(-1)">&#8592;</button>
    <input type="date" id="nav-date-input" class="nav-date-input" onchange="onDateChange(this.value)">
    <button class="nav-date-btn arrow" onclick="changeDate(1)">&#8594;</button>
  </div>
</nav>

<div class="content" id="content">
  <div class="loading"><div class="spinner"></div>Loading…</div>
</div>

<nav class="bottom-nav">
  <button class="bottom-btn" onclick="goPage('log')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5"/><path d="M17.5 3.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 8.5-8.5z"/></svg>
    Log
  </button>
  <button class="bottom-btn active" onclick="goPage('daily')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    Daily
  </button>
  <button class="bottom-btn" onclick="goPage('report')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Report
  </button>
</nav>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzQG2owq-8xkxg4DnLjOaI0nO6u0y5dhcHpgtV78TK-zII3-CvkW5XqQo6ENXJfUF2Jrg/exec";
const UTILITY_COLORS = { Hydro: "#1A3A5C", Water: "#0F6E56", Gas: "#7A4200" };

let selectedDate = getInitialDate();
let configData = null;

window.onload = async () => {
  document.getElementById("nav-date-input").value = selectedDate;
  const res = await fetch(`${API_URL}?action=getConfig`);
  configData = await res.json();
  await loadDaily();
};

function getInitialDate() {
  const params = new URLSearchParams(window.location.search);
  return params.get("date") || new Date().toISOString().slice(0, 10);
}

async function loadDaily() {
  document.getElementById("content").innerHTML = `<div class="loading"><div class="spinner"></div>Loading…</div>`;
  try {
    const res = await fetch(`${API_URL}?action=getDaily&date=${selectedDate}`);
    const data = await res.json();
    render(data);
  } catch(e) {
    document.getElementById("content").innerHTML = `<div class="loading">⚠ Could not load data.</div>`;
  }
}

function render(data) {
  const { readings, event, missing } = data;
  let html = `<div class="date-heading">${formatDisplayDate(selectedDate)}</div>`;

  if (event) {
    html += `<div class="event-banner">
      <div class="event-banner-icon">${event.type === "Engineering" ? "🔧" : "📋"}</div>
      <div>
        <div class="event-banner-title">${event.type} day</div>
        ${event.note ? `<div class="event-banner-note">${event.note}</div>` : ""}
      </div>
    </div>`;
  }

  const utilities = configData ? [...new Set(configData.meters.map(m => m.utility))] : ["Hydro","Water","Gas"];
  utilities.forEach(utility => {
    const meters = configData ? configData.meters.filter(m => m.utility === utility) : [];
    html += `<div class="utility-section">
      <div class="utility-header">
        <div class="utility-dot" style="background:${UTILITY_COLORS[utility]||'#888'}"></div>
        <div class="utility-label">${utility}</div>
      </div>`;

    meters.forEach(m => {
      const r = readings.find(rd => rd.meterId === m.meterId);
      const isMissing = !r || r.consumption === null;
      const isOut = r && r.outOfRange;
      const isAvg = r && (r.calcType === "WEEKEND_AVG" || r.calcType === "HOLIDAY_AVG");

      html += `<div class="reading-card">
        <div class="reading-row">
          <div class="reading-left">
            <div class="meter-name">${m.meterName}</div>
            <div class="meter-sub">${m.building} · ID: ${m.meterId}</div>
          </div>
          <div class="reading-right">`;

      if (isMissing) {
        html += `<div class="reading-value missing">data missing</div>`;
      } else {
        html += `<div class="reading-value ${isOut ? 'out-of-range' : ''}">${formatVal(r.consumption)}</div>
          <div class="reading-unit">${m.unit} daily</div>
          <div class="calc-badge ${isAvg ? 'avg' : ''}">${isAvg ? "averaged" : "actual"}</div>`;
      }

      html += `</div></div></div>`;
    });

    html += `</div>`;
  });

  document.getElementById("content").innerHTML = html;
}

function changeDate(delta) {
  const d = new Date(selectedDate);
  d.setDate(d.getDate() + delta);
  selectedDate = d.toISOString().slice(0,10);
  document.getElementById("nav-date-input").value = selectedDate;
  loadDaily();
}
function onDateChange(val) { selectedDate = val; loadDaily(); }
function formatVal(v) {
  if (v === null || v === undefined) return "—";
  return v.toLocaleString("en-CA", { minimumFractionDigits: 3, maximumFractionDigits: 3 });
}
function formatDisplayDate(d) {
  return new Date(d + "T12:00:00").toLocaleDateString("en-CA", { weekday:"long", year:"numeric", month:"long", day:"numeric" });
}
function goPage(page) {
  if (page === "log") window.location.href = `log.html?date=${selectedDate}`;
  if (page === "report") window.location.href = "report.html";
}
</script>
</body>
</html>
