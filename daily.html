<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utility Tracker — Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F2EE;--surface:#FFFFFF;--surface2:#F9F8F6;
    --border:#E2DDD6;--border2:#CCC8C0;
    --text:#1A1916;--text2:#6B6860;--text3:#A09D98;
    --accent:#1A3A5C;--danger:#C0392B;--warn:#B8800A;--warn-bg:#FDFAEF;
    --radius:10px;--radius-lg:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

  .nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100}
  .nav-brand{font-size:15px;font-weight:600;letter-spacing:-.3px}
  .nav-brand span{color:var(--accent)}
  .nav-date-wrap{display:flex;align-items:center;gap:6px}
  .nav-arrow{background:none;border:1px solid var(--border2);border-radius:8px;padding:6px 11px;font-size:16px;color:var(--text2);cursor:pointer;line-height:1;transition:background .15s}
  .nav-arrow:hover{background:var(--bg)}
  .nav-date-input{font:14px 'DM Sans',sans-serif;border:1px solid var(--border2);border-radius:8px;padding:6px 10px;background:var(--surface);color:var(--text);cursor:pointer;max-width:140px}

  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:100}
  .bottom-btn{flex:1;padding:10px 0;font:500 12px 'DM Sans',sans-serif;border:none;background:none;cursor:pointer;color:var(--text2);display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s}
  .bottom-btn.active{color:var(--accent)}
  .bottom-btn svg{width:20px;height:20px}

  .content{padding:12px 14px 90px;max-width:600px;margin:0 auto}
  .date-heading{font:400 13px 'DM Sans',sans-serif;color:var(--text2);text-align:center;padding:6px 0 10px}

  .event-banner{background:#FFF8E8;border:1px solid #F5C842;border-radius:var(--radius-lg);padding:12px 16px;margin-bottom:14px;display:flex;align-items:flex-start;gap:10px}
  .event-icon{font-size:18px;flex-shrink:0;margin-top:1px}
  .event-type{font:600 13px 'DM Sans',sans-serif;color:#7A5800}
  .event-note-text{font:400 12px 'DM Sans',sans-serif;color:#9A7010;margin-top:2px}

  .utility-section{margin-bottom:18px}
  .utility-header{display:flex;align-items:center;gap:8px;padding:8px 0 6px}
  .u-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .u-label{font:600 13px 'DM Sans',sans-serif;color:var(--text)}

  .reading-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:8px}
  .reading-row{display:flex;justify-content:space-between;align-items:flex-start}
  .r-name{font:500 14px 'DM Sans',sans-serif;color:var(--text)}
  .r-sub{font:400 12px 'DM Sans',sans-serif;color:var(--text2);margin-top:2px}
  .r-right{text-align:right}
  .r-value{font:600 18px 'DM Mono',monospace;color:var(--text)}
  .r-value.out{color:var(--danger)}
  .r-value.missing{font:500 14px 'DM Sans',sans-serif;color:var(--danger)}
  .r-unit{font:400 12px 'DM Sans',sans-serif;color:var(--text2);margin-top:2px}
  .calc-badge{display:inline-block;font:400 11px 'DM Sans',sans-serif;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:2px 6px;color:var(--text3);margin-top:4px}
  .calc-badge.avg{background:var(--warn-bg);color:var(--warn);border-color:#F5C842}

  .loading{text-align:center;padding:40px 20px;color:var(--text2);font-size:14px}
  .spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">Utility <span>Tracker</span></div>
  <div class="nav-date-wrap">
    <button class="nav-arrow" onclick="changeDate(-1)">&#8592;</button>
    <input type="date" id="nav-date-input" class="nav-date-input" onchange="onDateChange(this.value)">
    <button class="nav-arrow" onclick="changeDate(1)">&#8594;</button>
  </div>
</nav>

<div class="content" id="content">
  <div class="loading"><div class="spinner"></div>Loading…</div>
</div>

<nav class="bottom-nav">
  <button class="bottom-btn" onclick="goPage('log')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5"/><path d="M17.5 3.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 8.5-8.5z"/></svg>
    Log
  </button>
  <button class="bottom-btn active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    Daily
  </button>
  <button class="bottom-btn" onclick="goPage('report')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Report
  </button>
</nav>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzBymh9RQmM8ZkQMo6B0rajLr2sqj7If-Lt4pD2hoewzMht4iRMKDjDupSam_L-LLIqcw/exec";
const U_COLORS = { Hydro:"#1A3A5C", Water:"#0F6E56", Gas:"#7A4200" };

let selectedDate = getInitialDate();
let configData = null;

window.onload = async () => {
  document.getElementById("nav-date-input").value = selectedDate;
  const res = await fetch(`${API_URL}?action=getConfig`);
  configData = await res.json();
  await loadDaily();
};

function getInitialDate() {
  const p = new URLSearchParams(window.location.search);
  return p.get("date") || new Date().toISOString().slice(0,10);
}

async function loadDaily() {
  document.getElementById("content").innerHTML = `<div class="loading"><div class="spinner"></div>Loading…</div>`;
  try {
    const res = await fetch(`${API_URL}?action=getDaily&date=${selectedDate}`);
    const data = await res.json();
    render(data);
  } catch(e) {
    document.getElementById("content").innerHTML = `<div class="loading">⚠ Could not load data.</div>`;
  }
}

function render(data) {
  const { readings, event } = data;
  let html = `<div class="date-heading">${formatDisplay(selectedDate)}</div>`;

  if (event && event.type) {
    html += `<div class="event-banner">
      <div class="event-icon">${event.type==="Engineering"?"🔧":"📋"}</div>
      <div>
        <div class="event-type">${event.type} day</div>
        ${event.note?`<div class="event-note-text">${event.note}</div>`:""}
      </div>
    </div>`;
  }

  const utilities = configData ? [...new Set(configData.meters.map(m=>m.utility))] : [];
  utilities.forEach(u => {
    const meters = configData.meters.filter(m => m.utility === u);
    html += `<div class="utility-section">
      <div class="utility-header">
        <div class="u-dot" style="background:${U_COLORS[u]||'#888'}"></div>
        <div class="u-label">${u}</div>
      </div>`;

    meters.forEach(m => {
      const r = readings.find(rd => rd.meterId === m.meterId);
      const isMissing = !r || r.consumption === null;
      const isOut = r && r.outOfRange;
      const isAvg = r && (r.calcType==="WEEKEND_AVG"||r.calcType==="HOLIDAY_AVG");

      html += `<div class="reading-card">
        <div class="reading-row">
          <div>
            <div class="r-name">${m.meterName}</div>
            <div class="r-sub">${m.building} · ${m.meterId}</div>
          </div>
          <div class="r-right">`;

      if (isMissing) {
        html += `<div class="r-value missing">data missing</div>`;
      } else {
        html += `<div class="r-value ${isOut?'out':''}">${formatNum(r.consumption)}</div>
          <div class="r-unit">${m.unit} daily</div>
          <div class="calc-badge ${isAvg?'avg':''}">${isAvg?"averaged":"actual"}</div>`;
      }
      html += `</div></div></div>`;
    });
    html += `</div>`;
  });

  document.getElementById("content").innerHTML = html;
}

function changeDate(delta) {
  const d = new Date(selectedDate + "T12:00:00");
  d.setDate(d.getDate() + delta);
  selectedDate = d.toISOString().slice(0,10);
  document.getElementById("nav-date-input").value = selectedDate;
  loadDaily();
}
function onDateChange(val) { selectedDate = val; loadDaily(); }

function formatNum(v) {
  if (v===null||v===undefined) return "—";
  return v.toLocaleString("en-CA",{minimumFractionDigits:3,maximumFractionDigits:3});
}
function formatDisplay(dateStr) {
  const d = new Date(dateStr+"T12:00:00");
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const D=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  return `${M[d.getMonth()]} ${d.getDate()} ${d.getFullYear()} (${D[d.getDay()]})`;
}
function goPage(page) {
  if (page==="log") location.href=`log.html?date=${selectedDate}`;
  if (page==="report") location.href="report.html";
}
</script>
</body>
</html>
